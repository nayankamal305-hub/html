<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="घर का बिजली बिल बाँटें"><title>Bill Buddy — बिजली बिल बाँटें</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div><p class="eyebrow">भारत के लिए offline-first tool</p><h1>Bill Buddy</h1><p class="sub">घर का बिजली बिल roommates या परिवार में आसानी से बाँटें।</p></div><button id="resetBtn" class="ghost">रीसेट</button></header><section class="card"><h2>1. बिल की जानकारी</h2><div class="grid"><label>कुल बिल (₹)<input id="bill" type="number" min="0" step="0.01" placeholder="जैसे 2400"></label><label>कुल यूनिट<input id="units" type="number" min="0" step="0.01" placeholder="जैसे 320"></label><label>फिक्स्ड चार्ज (₹)<input id="fixed" type="number" min="0" step="0.01" value="0"></label><label>बाँटने का तरीका<select id="method"><option value="equal">बराबर हिस्से</option><option value="units">मीटर यूनिट के हिसाब से</option></select></label></div></section><section class="card"><div class="row"><h2>2. लोग जोड़ें</h2><button id="addBtn" class="primary small">+ व्यक्ति</button></div><div id="people"></div><p class="hint">मीटर यूनिट mode में हर व्यक्ति की यूनिट भरें।</p></section><section class="card result"><div class="row"><h2>3. परिणाम</h2><button id="copyBtn" class="ghost small">कॉपी</button></div><div id="summary" class="summary">जानकारी भरकर परिणाम देखें।</div><div id="results"></div></section><section class="note"><strong>गोपनीयता:</strong> आपका डेटा इसी device के browser में रहता है।</section></main><script type="module" src="app.js"></script></body></html>
